services:
  backend:
    build: ./Backend
    ports:
      - "8001:8001"
    environment:
      SERVER_PORT: 8001
      DATABASE_URL: jdbc:postgresql://db:5432/chat_db
      DB_USER: chat
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USER: chat
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-localdev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_CACHE_TYPE: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_EXPIRATION_DATE: ${JWT_EXPIRATION_DATE:-900000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_SCHEDULER_THREADS: ${DB_SCHEDULER_THREADS:-2}
      DB_SCHEDULER_POLLING_INTERVAL: ${DB_SCHEDULER_POLLING_INTERVAL:-1s}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_CONFIRM_TIMEOUT: ${OUTBOX_CONFIRM_TIMEOUT:-5s}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-30s}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 3 http://localhost:8001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localdev}
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:61613:61613"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
