# Puerto del servidor
server.port=${SERVER_PORT:8001}

# --- Base de datos ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Zona horaria ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.main.allow-bean-definition-overriding=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.stomp-port=${RABBITMQ_STOMP_PORT:61613}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
rabbitmq.queue.name=chat.default.queue

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${REDIS_CACHE_TYPE:redis}

# --- Capa de seguridad ---
jwt.secretKey=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION_DATE}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
db-scheduler.polling-interval=${DB_SCHEDULER_POLLING_INTERVAL:1s}
db-scheduler.threads=${DB_SCHEDULER_THREADS:1}
