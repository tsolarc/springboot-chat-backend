# Puerto del servidor
server.port=${SERVER_PORT:8001}

# --- Base de datos ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Zona horaria ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.main.allow-bean-definition-overriding=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.stomp-port=${RABBITMQ_STOMP_PORT:61613}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
rabbitmq.queue.name=chat.default.queue

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${REDIS_CACHE_TYPE:redis}

# --- Capa de seguridad ---
jwt.secretKey=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION_DATE}
monitoring.username=${MONITORING_USERNAME:prometheus}
monitoring.password=${MONITORING_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/livez
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/health
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.connection-timeout=3000
logging.pattern.level=%5p [requestId:%X{requestId:-}]
db-scheduler.polling-interval=${DB_SCHEDULER_POLLING_INTERVAL:1s}
db-scheduler.threads=${DB_SCHEDULER_THREADS:2}
messaging.outbox.workers=${OUTBOX_WORKERS:4}
messaging.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
messaging.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:12}
messaging.outbox.confirm-timeout=${OUTBOX_CONFIRM_TIMEOUT:5s}
messaging.outbox.lease-duration=${OUTBOX_LEASE_DURATION:30s}
messaging.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
